[project]
name = "repomind"
version = "1.1.0"
description = "Multi-Agent & Heuristic Codebase Onboarding Assistant"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "W291", "W293", "E402"]
